# Shared by programming and verification-only attempts. Markers are printed only
# after each operation succeeds; Python also compares the entire readback file.
echo "AM32_VERIFY_START"
flash verify_bank 0 $BOOTLOADER
if { [info exists READBACK] } {
    flash read_bank 0 $READBACK 0 [file size $BOOTLOADER]
    echo "AM32_READBACK_COMPLETE"
}
echo "AM32_VERIFY_COMPLETE"
